# OPTIONAL: lets GitHub collect live data for you every 3 hours, for free,
# so the online dashboard always shows recent ships.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
#        New repository secret, name AISSTREAM_API_KEY, value = your key.
name: Collect live ship data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you start it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector.py --minutes 15
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Save the new data to the repository
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ships.json
          git commit -m "Update live ship data" || echo "No changes"
          git push
