# OPTIONAL: lets GitHub collect live data for you every 3 hours, for free,
# so the online dashboard always shows recent ships.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
#        New repository secret, name AISSTREAM_API_KEY, value = your key.
name: Collect live ship data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you start it by hand from the Actions tab

# Only what the job needs: permission to save data/ships.json back to the repository.
permissions:
  contents: write

# Never run two collections at the same time (they would overwrite each other's data).
concurrency:
  group: collect-ship-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned to exact versions (commit IDs), so a changed or hijacked tag can't swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0     # full history: the ML model learns from every saved snapshot
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector.py --minutes 15
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Save the new data to the repository
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ships.json
          git commit -m "Update live ship data" || echo "No changes"
      - name: Retrain the experimental ML model on all snapshots
        continue-on-error: true     # if training fails, still upload the new ship data below
        run: |
          python eta_model.py
          git add model/eta_model.json
          git commit -m "Retrain ETA model" || echo "No changes"
      - name: Rebuild the arrivals history (shipping-line scorecard)
        continue-on-error: true     # same: never block the ship data upload
        run: |
          python history.py
          git add data/arrivals.json
          git commit -m "Update arrivals history" || echo "No changes"
      # Runs after a successful collection, even if retraining failed (continue-on-error above).
      - name: Upload
        run: |
          git pull --rebase    # pick up any code changes pushed while we were collecting
          git push
